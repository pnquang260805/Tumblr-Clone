services:
  minio:
    container_name: minio
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    volumes:
      - ./docker-data/minio:/mnt/data
    ports:
      - "9000:9000" # API s3
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    networks:
      - project_net
    deploy:
      resources:
        limits:
          cpus: '0.01'
          memory: 300M
  minio-init:
    container_name: minio-init
    image: amazon/aws-cli:latest
    depends_on:
      - minio
    environment:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://minio:9000 s3 ls > /dev/null 2>&1; do
        echo 'Waiting for MinIO...'; sleep 2;
      done;
      if aws --endpoint-url http://minio:9000 s3api head-bucket --bucket my-bucket > /dev/null 2>&1; then
        echo 'Bucket my-bucket already exists, skipping creation';
      else
        aws --endpoint-url http://minio:9000 s3 mb s3://my-bucket && echo 'Bucket created';
      fi;
      "
    restart: "no"
    networks:
      - project_net

networks:
  project_net:
    driver: bridge