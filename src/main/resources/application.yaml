spring:
  application:
    name: tumblrclone
  datasource:
    url: jdbc:h2:file:./data/mydb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
#  Cấu hình kích thước đầu vào
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

s3:
  endpoint: http://localhost:9000
  accessKey: admin
  secretKey: password
  bucket: my-bucket
  region: us-east-1